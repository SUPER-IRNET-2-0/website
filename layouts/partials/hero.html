<section class="hero{{ if eq .Section "workshop" }} hero--workshop{{ end }}">
  <div class="hero__media">
    <img src="{{ .Params.hero | default "images/superirnet.png" | relURL }}" alt="">
  </div>
  <div class="hero__copy">
    <p class="eyebrow">{{ site.Params.heroEyebrow }}</p>
    <h1>{{ .Params.headline | default .Title }}</h1>
    <p>{{ site.Params.heroDescription }}</p>
  </div>
</section>
